        // Function to render a specific scene
        function renderScene(sceneKey) {
            // Safety check in case of a missing link
            if (!storyData[sceneKey]) {
                console.error("Scene not found:", sceneKey);
                sceneKey = 'start';
            }

            const scene = storyData[sceneKey];

            // Update the text
            document.getElementById('story-text').innerText = scene.text;

            // Handle the Image (Show if exists, Hide if not)
            const storyImage = document.getElementById('story-image');
            if (scene.image) {
                storyImage.src = scene.image;
                storyImage.classList.remove('hidden');
            } else {
                storyImage.classList.add('hidden');
                storyImage.src = "";
            }

            // Clear old buttons
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            // Create new buttons
            scene.options.forEach(option => {
                // Skip empty buttons
                if (option.label === "") return;

                const button = document.createElement('button');
                button.innerText = option.label;

                // NEW: Upgraded button styles with Dark Mode and special Hover/Active Reactions!
                button.className = "px-4 py-3 bg-blue-900 border-2 border-transparent text-white rounded-xl hover:bg-blue-800 hover:border-yellow-400 hover:-translate-y-1 active:scale-95 cursor-pointer transition-all duration-300 font-bold shadow-md w-full";

                // When clicked, check if it's a "close" action, otherwise render the next scene
                if (option.action === "close") {
                    button.onclick = () => {
                        window.close();
                        // Fallback text just in case the browser blocks the close action
                        document.getElementById('story-text').innerText = "您可以安全地关闭这个标签页了。(You may safely close this tab.)";
                        choicesContainer.innerHTML = '';
                    };
                } else {
                    button.onclick = () => renderScene(option.next);
                }

                choicesContainer.appendChild(button);
            });
        }

        renderScene('start');
